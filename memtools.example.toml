# Copy to memtools.toml in your notes folder (or ~/.config/memtools/config.toml). Every section is optional.

[layout]
# arcs_dir = "projects"        # notes about work in progress (status: active / closed / stale)
# rules_dir = "rules"          # promoted rules; vault-index lists them all, ordered by use
# candidate_dir = "drafts"     # vault-applied looks for promotion candidates only here (default: everywhere)
# hot_heading = "CURRENT WORKING SET"   # the heading in index.md that `vault-recall --arcs` prints
# exclude_dirs = [".git", "raw", "scripts", "__pycache__"]

[layout.tiers]
# Folder -> weight for recall ranking; also the colour groups in the graph. Unlisted folders weigh 1.0.
# rules = 1.6
# projects = 1.3
# journal = 0.8

[index]
# vault-index refuses to write past these. Set them only if a harness auto-loads index.md: such a harness cuts the
# file off past a limit without saying so, and the limit can change between versions. Use the numbers yours reports.
# max_lines = 150
# max_bytes = 20000

[graph.topics]
# Topic name -> tags that put a note in it (from the note's `tags:` frontmatter).
# cooking = ["bread", "sourdough", "oven"]

[hosts]
# A claim written "web1:file_exists: /etc/nginx/nginx.conf" is checked over ssh on this target.
# web1 = "deploy@web1.example.com"

[verify]
# If set, vault-verify refuses to run elsewhere (claims without a host prefix are meant for this host),
# unless given --any-host.
# home_host = "myserver"
